name: CodeQL

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  schedule:
    - cron: '31 3 * * 1'
  workflow_dispatch:
    inputs:
      kotlin_incremental:
        description: 'Pass kotlin.incremental=<value> to the extraction build (A/B experiment)'
        type: boolean
        default: true

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: single
  # PRs: newest analysis replaces the running one for fast feedback. Main and
  # merge_group: serialize so the required check reports for that exact SHA
  # and queued runs don't race on the shared Gradle/CodeQL Actions caches.
  # Pattern from ORCHORDS/W.A.S.P ci.yml; queue semantics per GitHub's
  # "Control the concurrency of workflows and jobs" documentation.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Every leg runs on GitHub-hosted runners. The self-hosted java-kotlin
    # route measured 11m48s vs 7m12s hosted for the same commit (runs
    # 33529475242 / 33529437085): the runner's 2013-era Xeon E5-2690 v2
    # loses more per-core speed than its warm Gradle workspace saves back.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build: true
          - language: javascript-typescript
            build: false
          - language: actions
            build: false
          - language: c-cpp
            build: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
          clean: false

      - name: Verify material-color-utilities source identity
        if: matrix.build
        shell: bash
        run: |
          set -euo pipefail
          git submodule status --recursive
          expected="$(git ls-tree HEAD material3/material-color-utilities | awk '{print $3}')"
          actual="$(git -C material3/material-color-utilities rev-parse HEAD)"
          test -n "$expected"
          test "$actual" = "$expected"
          test -f material3/material-color-utilities/kotlin/dynamiccolor/DynamicScheme.kt

      - name: Set up build toolchain
        # CodeQL never runs the web-ui build (see web/build.gradle.kts), so
        # pnpm/Node are not needed on this leg.
        if: matrix.build
        uses: ./.github/actions/setup-build
        with:
          web: false
          # Hosted runners need Gradle User Home (distribution, dependencies,
          # build cache) restored from the Actions cache on every event.
          gradle: true
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build && 'manual' || 'none' }}

      - name: Compile for extraction
        # Force only compiler/KSP tasks so CodeQL observes real compilation;
        # preserve unrelated warm outputs and build-cache reuse.
        if: matrix.build
        # kotlin.build.report prints each compile task's IC on/off state so
        # the A/B logs prove the kotlin.incremental toggle took effect.
        run: ./gradlew -PcodeqlForceCompile=true -Pkotlin.incremental=${{ inputs.kotlin_incremental != false && 'true' || 'false' }} -Pkotlin.build.report.output=console :material3:compileDebugUnitTestKotlin :app:compileDebugKotlin --no-daemon --stacktrace

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:${{ matrix.language }}"
