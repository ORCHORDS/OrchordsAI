name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '31 3 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build: true
          - language: javascript-typescript
            build: false
          - language: actions
            build: false
          - language: c-cpp
            build: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Verify material-color-utilities source identity
        if: matrix.build
        shell: bash
        run: |
          set -euo pipefail
          git submodule status --recursive
          expected="$(git ls-tree HEAD material3/material-color-utilities | awk '{print $3}')"
          actual="$(git -C material3/material-color-utilities rev-parse HEAD)"
          test -n "$expected"
          test "$actual" = "$expected"
          test -f material3/material-color-utilities/kotlin/dynamiccolor/DynamicScheme.kt

      - name: Set up JDK
        if: matrix.build
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: matrix.build
        # Caches Gradle User Home (distribution, dependencies, build cache) so
        # dependency resolution and compilation are warm on later runs.
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Verify material3 dependency identity
        if: matrix.build
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/material3-debugCompileClasspath.txt"
          ./gradlew :material3:dependencies --configuration debugCompileClasspath --no-daemon > "$report"
          if grep -Eqi '(^|[ :])material-color-utilities([ :]|$)' "$report"; then
            echo "::error::material-color-utilities must come only from the pinned Git submodule"
            grep -Ei 'material-color-utilities' "$report" || true
            exit 1
          fi

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build && 'manual' || 'none' }}

      - name: Compile and test for extraction
        # Single Gradle invocation: one configuration pass, tasks run in parallel.
        # --no-build-cache is required: FROM-CACHE task outputs skip real
        # compilation, and CodeQL manual extraction then sees no sources built
        # ("this run didn't build any of it", gh.io/troubleshooting-code-scanning/no-source-code-seen-during-build).
        if: matrix.build
        run: ./gradlew :material3:compileDebugKotlin :material3:testDebugUnitTest :app:compileDebugKotlin --no-daemon --stacktrace --no-build-cache

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:${{ matrix.language }}"
