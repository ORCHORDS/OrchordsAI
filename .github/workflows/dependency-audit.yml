name: Dependency Audit

on:
  push:
    branches: [main]
    paths:
      - 'trace-cli/package.json'
      - 'trace-cli/bun.lock'
      - 'web-ui/package.json'
      - 'web-ui/pnpm-lock.yaml'
      - '.github/workflows/dependency-audit.yml'
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pnpm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Audit web-ui dependency graph
        working-directory: web-ui
        shell: bash
        run: |
          set -o pipefail
          pnpm audit --json | tee pnpm-audit.json

  bun-trace-cli-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Audit trace-cli Bun dependency graph
        working-directory: trace-cli
        shell: bash
        run: |
          set -o pipefail
          bun audit --json | tee bun-audit.json
