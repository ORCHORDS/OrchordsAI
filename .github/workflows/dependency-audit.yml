name: Dependency Audit

on:
  push:
    branches: [main]
    paths:
      - 'trace-cli/package.json'
      - 'trace-cli/bun.lock'
      - 'web-ui/package.json'
      - 'web-ui/pnpm-lock.yaml'
      - '.github/workflows/dependency-audit.yml'
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pnpm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Audit web-ui dependency graph
        working-directory: web-ui
        shell: bash
        run: |
          set -o pipefail
          pnpm audit --json | tee pnpm-audit.json

  bun-trace-cli-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Audit trace-cli Bun dependency graph
        working-directory: trace-cli
        shell: bash
        run: |
          set -o pipefail
          bun audit --json | tee bun-audit.json
