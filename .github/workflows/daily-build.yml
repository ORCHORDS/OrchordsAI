name: Daily Build

on:
  schedule:
    - cron: '0 9,18 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check for recent commits
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$(git log --since='24 hours ago' --oneline)" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "No commits in the past 24 hours, skipping build"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Prepare signing files
        env:
          KEY_BASE64: ${{ secrets.KEY_BASE64 }}
          SIGNING_CONFIG: ${{ secrets.SIGNING_CONFIG }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [ -z "$KEY_BASE64" ] || [ -z "$SIGNING_CONFIG" ]; then
            echo "Required signing secrets are not configured" >&2
            exit 1
          fi
          printf '%s' "$KEY_BASE64" | base64 --decode > app/app.key
          printf '%s\n' "$SIGNING_CONFIG" > local.properties

      - name: Gradle Build
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Remove signing files
        if: always()
        shell: bash
        run: rm -f app/app.key local.properties

      - name: Generate APK checksums
        shell: bash
        run: |
          set -euo pipefail
          cd app/build/outputs/apk/release
          sha256sum -- *.apk > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Attest APK build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'app/build/outputs/apk/release/*.apk'

      - name: Stage APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-apks
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-apks
          path: dist

      - name: Verify staged checksums
        working-directory: dist
        shell: bash
        run: sha256sum --check SHA256SUMS

      - name: Publish nightly prerelease
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: nightly
          name: Nightly Build
          prerelease: true
          body: |
            Automated daily build (commit `${{ github.sha }}`).

            SHA-256 checksums are attached in `SHA256SUMS`.
            Build provenance is published as a GitHub artifact attestation.

            > Development build — may be unstable, for testing only.
          files: |
            dist/*.apk
            dist/SHA256SUMS
