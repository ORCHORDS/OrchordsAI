name: Daily Build

on:
  schedule:
    - cron: '0 9,18 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      # No checkout needed: query the commits API for activity in the last 24h.
      - name: Check for recent commits
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          since="$(date -u -d '24 hours ago' '+%Y-%m-%dT%H:%M:%SZ')"
          count="$(gh api "repos/$REPOSITORY/commits" -X GET -f since="$since" -f per_page=1 --jq 'length')"
          if [ "$count" -gt 0 ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "No commits in the past 24 hours, skipping build"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      apk_dir: ${{ steps.build_mode.outputs.apk_dir }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        # Replaces the coarse actions/cache of ~/.gradle/caches with
        # fine-grained Gradle User Home caching (deps + wrapper + build cache).
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Select build mode
        id: build_mode
        env:
          KEY_BASE64: ${{ secrets.KEY_BASE64 }}
          SIGNING_CONFIG: ${{ secrets.SIGNING_CONFIG }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEY_BASE64" ] && [ -n "$SIGNING_CONFIG" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "gradle_task=assembleRelease" >> "$GITHUB_OUTPUT"
            echo "apk_dir=app/build/outputs/apk/release" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "gradle_task=assembleDebug" >> "$GITHUB_OUTPUT"
            echo "apk_dir=app/build/outputs/apk/debug" >> "$GITHUB_OUTPUT"
            echo "Signing secrets are unavailable; producing an unsigned debug nightly artifact instead."
          fi

      - name: Prepare signing files
        if: steps.build_mode.outputs.signed == 'true'
        env:
          KEY_BASE64: ${{ secrets.KEY_BASE64 }}
          SIGNING_CONFIG: ${{ secrets.SIGNING_CONFIG }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEY_BASE64" | base64 --decode > app/app.key
          printf '%s\n' "$SIGNING_CONFIG" > local.properties

      - name: Gradle Build
        env:
          GRADLE_TASK: ${{ steps.build_mode.outputs.gradle_task }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon "$GRADLE_TASK"

      - name: Remove signing files
        if: always()
        shell: bash
        run: rm -f app/app.key local.properties

      - name: Generate APK checksums
        env:
          APK_DIR: ${{ steps.build_mode.outputs.apk_dir }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$APK_DIR"
          sha256sum -- *.apk > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Stage APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-apks
          path: |
            ${{ steps.build_mode.outputs.apk_dir }}/*.apk
            ${{ steps.build_mode.outputs.apk_dir }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  attest:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-apks
          path: dist

      - name: Verify APK checksums before attestation
        working-directory: dist
        shell: bash
        run: sha256sum --check SHA256SUMS

      - name: Attest APK build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'dist/*.apk'

  publish:
    needs: attest
    if: needs.attest.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-apks
          path: dist

      - name: Verify staged checksums
        working-directory: dist
        shell: bash
        run: sha256sum --check SHA256SUMS

      - name: Publish nightly prerelease
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: nightly
          name: Nightly Build
          prerelease: true
          body: |
            Automated daily build (commit `${{ github.sha }}`).

            SHA-256 checksums are attached in `SHA256SUMS`.
            Build provenance is published as a GitHub artifact attestation.
            When repository signing secrets are unavailable, the workflow publishes an unsigned debug APK instead of failing.

            > Development build — may be unstable, for testing only.
          files: |
            dist/*.apk
            dist/SHA256SUMS
