name: Citation Integrity Tests

on:
  push:
    branches: [main]
    paths:
      - 'app/src/main/java/com/orchords/orchordsai/ui/components/message/CitationScope.kt'
      - 'app/src/main/java/com/orchords/orchordsai/ui/components/message/ChatMessageCot.kt'
      - 'app/src/test/java/com/orchords/orchordsai/ui/components/message/CitationScopeTest.kt'
      - '.github/workflows/citation-integrity.yml'
  pull_request:
    paths:
      - 'app/src/main/java/com/orchords/orchordsai/ui/components/message/CitationScope.kt'
      - 'app/src/main/java/com/orchords/orchordsai/ui/components/message/ChatMessage.kt'
      - 'app/src/test/java/com/orchords/orchordsai/ui/components/message/CitationScopeTest.kt'
      - '.github/workflows/citation-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: citation-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Run citation integrity regression tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest --tests 'com.orchords.orchordsai.ui.components.message.CitationScopeTest'
