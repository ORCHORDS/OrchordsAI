name: Citation Integrity Tests

# Keep workflow_dispatch available for current-head revalidation after CI repairs.
on:
  push:
    branches: [main]
    paths:
      - 'app/src/main/java/com/orchords/orchordsai/ui/components/message/CitationScope.kt'
      - 'app/src/main/java/com/orchords/orchordsai/ui/components/message/ChatMessage.kt'
      - 'app/src/test/java/com/orchords/orchordsai/ui/components/message/CitationScopeTest.kt'
      - '.github/workflows/citation-integrity.yml'
  pull_request:
    paths:
      - 'app/src/main/java/com/orchords/orchordsai/ui/components/message/CitationScope.kt'
      - 'app/src/main/java/com/orchords/orchordsai/ui/components/message/ChatMessage.kt'
      - 'app/src/test/java/com/orchords/orchordsai/ui/components/message/CitationScopeTest.kt'
      - '.github/workflows/citation-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-24.04' || 'ubuntu-24.04-x64' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
          clean: false

      - name: Set up build toolchain
        uses: ./.github/actions/setup-build
        with:
          gradle: ${{ github.event_name == 'pull_request' }}
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      - name: Run citation integrity regression tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest --tests 'com.orchords.orchordsai.ui.components.message.CitationScopeTest'
