name: Close Blank Issues

on:
  issues:
    types: [opened]

permissions: {}

jobs:
  close-blank-issues:
    # 1-CPU container runner, free and faster to boot than a full VM; this
    # job runs github-script only and finishes in seconds.
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const author = context.payload.issue.user.login;
            const isOwner = author === context.repo.owner;

            const body = context.payload.issue.body;
            const templateMarkers = ['Problem Description', 'Feature Description'];
            const usedTemplate = body && templateMarkers.some(marker => body.includes(marker));

            if (!isOwner && !usedTemplate) {
              const repoUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}`;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: [
                  'This issue was closed because it was not submitted with an official template.',
                  'Please resubmit using one of the templates below and fill in the requested details:',
                  '',
                  `- [Bug Report](${repoUrl}/issues/new?template=bug-report.yml)`,
                  `- [Feature Request](${repoUrl}/issues/new?template=feature-request.yml)`,
                ].join('\n'),
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                state: 'closed',
              });
            }
