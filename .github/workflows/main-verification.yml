name: Main Verification

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  merge_group:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Tests run in a parallel job so a broken push fails fast while the
  # assemble job is still packaging. Fork/public PRs stay on GitHub-hosted
  # runners (security boundary); trusted events use the dedicated runner
  # with its warm daemon and persistent workspace.
  test:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-24.04' || 'main-verification' }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
          clean: false

      - name: Set up build toolchain
        uses: ./.github/actions/setup-build
        with:
          gradle: ${{ github.event_name == 'pull_request' }}
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      - name: Run unit tests and lint
        env:
          # PRs fail at the first broken test for faster feedback; trusted
          # push events run the full suite to completion on the warm daemon.
          GRADLE_FLAGS: ${{ github.event_name == 'pull_request' && '--no-daemon --fail-fast' || '' }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew $GRADLE_FLAGS :app:testDebugUnitTest :app:lintDebug

  assemble:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-24.04' || 'main-verification' }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
          clean: false

      - name: Set up build toolchain
        uses: ./.github/actions/setup-build
        with:
          gradle: ${{ github.event_name == 'pull_request' }}
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      - name: Assemble debug APK
        env:
          GRADLE_FLAGS: ${{ github.event_name == 'pull_request' && '--no-daemon' || '' }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew $GRADLE_FLAGS -PciVerify :app:assembleDebug
