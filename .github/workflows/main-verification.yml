name: Main Verification

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fork/public PRs stay on GitHub-hosted runners (security boundary).
  # Trusted events (push, merge_group, schedule, dispatch) use the X79.
  # The PR lanes keep --no-daemon + Actions-cache; the X79 lanes reuse the
  # warm Gradle daemon and persistent local Gradle User Home instead.
  IS_PR: ${{ github.event_name == 'pull_request' }}

jobs:
  # Tests run in a parallel job so a broken push fails fast while the
  # assemble job is still packaging. Both jobs share compiled outputs via
  # the build cache (PR) or the persistent workspace (X79).
  test:
    runs-on: ${{ env.IS_PR == 'true' && 'ubuntu-24.04' || 'x79' }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
          # clean:false keeps build outputs on the persistent X79 workspace
          # so incremental compilation and task up-to-date checks survive
          # across runs. Harmless on ephemeral PR runners.
          clean: false

      - name: Set up build toolchain
        uses: ./.github/actions/setup-build
        with:
          # Actions-cache round-trip only pays off on ephemeral runners;
          # the X79 keeps its Gradle User Home on local disk.
          gradle: ${{ env.IS_PR == 'true' }}
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      - name: Run unit tests and lint
        env:
          GRADLE_FLAGS: ${{ env.IS_PR == 'true' && '--no-daemon' || '' }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew $GRADLE_FLAGS :app:testDebugUnitTest :app:lintDebug

  assemble:
    runs-on: ${{ env.IS_PR == 'true' && 'ubuntu-24.04' || 'x79' }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
          clean: false

      - name: Set up build toolchain
        uses: ./.github/actions/setup-build
        with:
          gradle: ${{ env.IS_PR == 'true' }}
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      - name: Assemble debug APK
        env:
          GRADLE_FLAGS: ${{ env.IS_PR == 'true' && '--no-daemon' || '' }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew $GRADLE_FLAGS -PciVerify :app:assembleDebug
