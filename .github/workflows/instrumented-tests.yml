name: Instrumented Tests

# Instrumented tests (androidTest) on a Gradle Managed Device using the
# ATD system image. Nightly lane only: it adds ~15-25 min and must not sit
# on the per-push critical path.
on:
  schedule:
    - cron: '37 4 * * 2,5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  managed-device:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Verify and enable KVM acceleration
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "::error::KVM is unavailable on this runner; the emulator would fall back to unusably slow software emulation."
            exit 1
          fi
          # /dev/kvm exists on hosted runners but is not always readable by
          # the runner user; the emulator reports "x86_64 emulation currently
          # requires hardware acceleration" without rw access.
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            sudo chmod a+rw /dev/kvm
          fi
          ls -l /dev/kvm

      - name: Set up build toolchain
        uses: ./.github/actions/setup-build
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      - name: Cache emulator system image
        # Cache SDK downloads (dependencies), never AVD state (mutable).
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/lib/android/sdk/system-images
          key: android-atd-34-x86_64-v1

      - name: Run instrumented tests on managed device
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:pixel6api34Check

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: instrumented-test-results
          path: |
            app/build/outputs/androidTest-results
            app/build/outputs/managedDevice
          if-no-files-found: ignore
          retention-days: 7
