name: Set up build toolchain
description: Shared JDK + Gradle (with caching) + pnpm/Node setup for Gradle workflows.

inputs:
  gradle:
    description: Whether to set up Gradle with GitHub Actions caching.
    type: boolean
    default: true
  web:
    description: Whether to set up pnpm/Node and install web-ui dependencies.
    type: boolean
    default: true

runs:
  using: composite
  steps:
    - name: Set up JDK
      uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
      with:
        distribution: temurin
        java-version: '17'

    - name: Set up Gradle
      # Caches Gradle User Home: distribution, resolved dependencies, toolchain
      # JDKs, and build-cache entries (org.gradle.caching=true).
      if: ${{ inputs.gradle }}
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

    - name: Set up pnpm
      if: ${{ inputs.web }}
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      with:
        version: 11

    - name: Set up Node
      if: ${{ inputs.web }}
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: web-ui/pnpm-lock.yaml

    - name: Install web-ui dependencies
      if: ${{ inputs.web }}
      shell: bash
      working-directory: web-ui
      run: pnpm install --frozen-lockfile
